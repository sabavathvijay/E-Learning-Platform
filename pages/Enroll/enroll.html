<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll</title>
    <link rel="stylesheet" href="./enroll.css">
</head>

<body>

    <fieldset>

        <legend>Enrolling</legend>

        <form>

            <div class="inputs">

                <div class="name">

                    
                    <label for="courseName">course Name :</label>
                    <input type="text" placeholder="Course NAme" required id="courseName">
                </div>
               
                <div class="mail">

                    
                    <label for="email">Email :</label>
                    <input type="email" placeholder="email" required id="email">
                    <input type="hidden" placeholder="CourseID" required id="courseID">
                </div>
            </div>

            <div class="btn">


                
                <button id="courseEnroll">Enroll</button>
            </div>

        </form>


    </fieldset>



    <script src="../../index.js"></script>

</body>

</html>
